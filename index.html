<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Duct-Aid Field Guide</title>
<meta name="description" content="The official Duct-Aid First-Aid Field Guide — searchable, step-by-step emergency instructions for the trail.">
<meta name="theme-color" content="#181818">

<!-- App icons -->
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand-row" id="brandRow"></div>
    <div class="search-wrap">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <input id="searchInput" type="text" placeholder="Search injuries, bites, burns…" autocomplete="off">
    </div>
  </header>
  <main id="main"></main>
  <nav class="bottom" id="bottomNav"></nav>
</div>

<script src="js/img-manifest.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

</html>
